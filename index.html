<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💌 Congratulation VN Women Day 💐</title>
    <meta name="theme-color" content="#f48fb1" />
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Screen 1: Login / Entry Form -->
    <div id="loginScreen">
        <div class="container" id="loginFormContainer">
            <h2 id="mainTitle" class="intro-mode">
                <span id="emojiLeft" class="hidden-emoji">💌 </span>
                <span id="titleText"></span>
                <span id="emojiRight" class="hidden-emoji"> 💐</span>
            </h2>
            
            <div id="formContent" class="form-content">
                <div class="input-row" id="inputRow">
                    <input type="text" id="nameInput" placeholder="Nhập tên của bạn...">
                    <div id="inviteCodeWrapper">
                        <input type="number" id="inviteCode" pattern="[0-9]*" inputmode="numeric" placeholder="Invite code">
                    </div>
                </div>
                <button id="btnSubmit"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Screen 2: Main App -->
    <div id="appScreen" style="display:none">
        <div id="inboxView">
            <div class="inbox-header">
                <h2>📬 Hộp thư đến</h2>
            </div>
            <div id="mailList"></div>
        </div>

        <div id="letterView" style="display:none">
            <button id="btnBack"><i class="fas fa-arrow-left"></i> Quay lại</button>
            <div class="letter-display">
                <div class="letter-paper">
                    <div id="letterDate" class="letter-date"></div>
                    <div id="letterTo" class="letter-to"></div>
                    <br>
                    <div id="letterContent" class="text-container"></div>
                    <br>
                    <div id="endingArea" class="ending"></div>
                    <div id="letterSender" class="signature"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Trình phát nhạc Spotify + Nút danh sách -->
    <div id="musicContainer" style="display:none">
        <div class="music-controls-wrapper">
            <button id="btnTogglePlaylist" title="Danh sách bài hát"><i class="fas fa-list-ul"></i></button>
        </div>
        <div id="spotifyPlayerWidget"></div>
        
        <div id="playlistPopup" class="playlist-popup">
            <div class="playlist-header">
                <span>Danh sách phát</span>
                <button id="btnClosePlaylist"><i class="fas fa-times"></i></button>
            </div>
            <div class="playlist-content" id="playlistItems"></div>
        </div>
    </div>

    <!-- NẠP TRỰC TIẾP FILE DATABASE -->
    <script src="name_reciver.js"></script>
    <script src="script.js"></script>
</body>
</html>
